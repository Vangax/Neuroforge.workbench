[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge"
version = "0.2.0"
description = "BIDS-native brain-data platform — load anything, find out what it is, clean it, and prove what you did."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["EEG", "MEG", "BIDS", "MNE", "neuroscience", "BCI", "electrophysiology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]

# Kept in step with backend/requirements.txt.
# The NumPy upper bound tracks SciPy's supported range (SciPy 1.15 requires <2.5).
dependencies = [
    "fastapi>=0.114",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "numpy>=1.26,<2.5",
    "scipy>=1.13",
    "pandas>=2.2",
    "mne>=1.7",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "h5py>=3.10",
]

[project.optional-dependencies]
# Lab Streaming Layer recordings.
xdf = ["pyxdf>=1.16"]
# Riemannian decoding in the BCI workbench.
bci = ["pyriemann>=0.6"]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.2"]
all = ["neuroforge[xdf,bci]"]

[project.scripts]
neuroforge = "neuroforge.cli:main"

[project.urls]
Homepage = "https://github.com/Vangax/Neuroforge.bench"
Source = "https://github.com/Vangax/Neuroforge.bench"
Issues = "https://github.com/Vangax/Neuroforge.bench/issues"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["neuroforge*"]

# The built interface is copied into neuroforge/web/ by scripts/build_release.py
# before the wheel is made, so `pip install neuroforge` gives you the whole app —
# one command, one URL, no Node required on the target machine.
[tool.setuptools.package-data]
neuroforge = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
